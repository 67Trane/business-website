<!-- #8a9ac4 keeps >= 4.5:1 contrast on the dark ink background (WCAG AA) -->
<!-- Extra bottom padding on mobile keeps the legal links clear of the sticky contact bar -->
<footer class="bg-ink pb-12 text-[#8a9ac4] md:pb-0">
  <div class="mx-auto flex max-w-330 flex-wrap items-center justify-between gap-7 px-6 py-12 sm:px-9 lg:px-13">
    <div>
      <a
        routerLink="/"
        fragment="top"
        class="inline-flex items-center gap-2.5 font-serif text-[1.3125rem] font-semibold tracking-tight text-[#eef1fb]"
      >
        <img
          src="images/brand/md-monogram-white.svg"
          alt=""
          aria-hidden="true"
          width="38"
          height="24"
          class="h-6 w-auto"
        />
        <span>{{ profile.name }}<span class="text-[#6b96f5]">.</span></span>
      </a>
      <p class="mt-1 text-sm">{{ content().footer.role }}</p>
    </div>

    <ul class="flex flex-wrap gap-x-1 gap-y-1 font-mono text-xs sm:gap-x-5 sm:gap-y-2">
      <li><a routerLink="/" fragment="leistungen" class="inline-flex min-h-11 items-center px-1 hover:text-white sm:min-h-0 sm:px-0">{{ content().nav.services }}</a></li>
      <li><a routerLink="/" fragment="ueber-mich" class="inline-flex min-h-11 items-center px-1 hover:text-white sm:min-h-0 sm:px-0">{{ content().nav.about }}</a></li>
      <li><a routerLink="/" fragment="ablauf" class="inline-flex min-h-11 items-center px-1 hover:text-white sm:min-h-0 sm:px-0">{{ content().nav.process }}</a></li>
      <li><a routerLink="/" fragment="referenzen" class="inline-flex min-h-11 items-center px-1 hover:text-white sm:min-h-0 sm:px-0">{{ content().nav.work }}</a></li>
    </ul>

    <div class="flex flex-wrap items-center gap-x-4 gap-y-1 font-mono text-xs">
      <span>© {{ year }} {{ profile.name }}</span>
      <a routerLink="/impressum" class="inline-flex min-h-11 items-center hover:text-white sm:min-h-0">{{ content().footer.imprint }}</a>
      <a routerLink="/datenschutz" class="inline-flex min-h-11 items-center hover:text-white sm:min-h-0">{{ content().footer.privacy }}</a>
    </div>
  </div>
</footer>
