@if (visible()) {
  <div
    class="animate-fade-up fixed inset-x-0 bottom-0 z-40 grid grid-cols-2 border-t border-brand/15 bg-white/95 pb-[env(safe-area-inset-bottom)] shadow-[0_-10px_28px_-14px_rgb(15_23_42/30%)] backdrop-blur-md md:hidden"
  >
    <a
      [href]="profile.phoneHref"
      class="flex items-center justify-center gap-2 py-3.5 text-sm font-bold text-brand"
      (click)="consent.trackContactClick('phone')"
    >
      <app-icon name="phone" class="size-4.5" />
      {{ content().stickyBar.call }}
    </a>
    <a
      [href]="profile.whatsappUrl"
      target="_blank"
      rel="noopener"
      class="flex items-center justify-center gap-2 bg-[#25d366] py-3.5 text-sm font-bold text-white"
      (click)="consent.trackContactClick('whatsapp')"
    >
      <app-icon name="whatsapp" class="size-4.5" />
      {{ content().stickyBar.whatsapp }}
    </a>
  </div>
}
