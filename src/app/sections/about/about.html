<section id="ueber-mich" class="bg-canvas">
  <div class="site-shell grid items-center gap-12 lg:grid-cols-[0.9fr_1.1fr] lg:gap-20">
    <!-- Portrait on a tinted panel; the cut-out photo sits on the panel's floor -->
    <div
      class="about-portrait relative mx-auto w-full max-w-md overflow-clip rounded-[1.75rem] lg:max-w-none"
    >
      <div
        aria-hidden="true"
        class="absolute inset-0 bg-linear-to-b from-[#dde4f7] to-[#bccbef]"
      ></div>
      <div
        aria-hidden="true"
        class="absolute inset-x-0 top-[8%] mx-auto aspect-square w-[85%] rounded-full bg-[radial-gradient(circle,rgb(30_82_204/30%),transparent_68%)]"
      ></div>
      <img
        ngSrc="images/profile.webp"
        width="640"
        height="800"
        [alt]="content().about.portraitAlt"
        class="about-photo relative block h-auto w-full"
        data-scroll-fx
      />
      <p
        class="absolute bottom-4 left-4 rounded-full bg-white/90 px-4 py-2 text-sm font-semibold text-ink shadow-sm backdrop-blur-sm"
      >
        Mehmet Deliaci
        <span class="font-normal text-copy">· {{ content().about.facts[0].value }}</span>
      </p>
    </div>

    <div>
      <app-section-heading
        data-reveal
        data-scroll-fx
        [eyebrow]="content().about.label"
        [title]="content().about.heading"
      />
      <p class="mt-7 font-serif text-[clamp(1.25rem,2vw,1.5rem)] leading-snug text-ink">
        {{ content().about.lead }}
      </p>
      <p class="mt-5 text-md text-copy sm:text-base sm:leading-relaxed">{{ content().about.p1 }}</p>

      <dl class="mt-9 grid grid-cols-2 gap-x-6 gap-y-5 border-t border-ink/10 pt-7">
        @for (fact of content().about.facts; track fact.label) {
          <div>
            <dt class="micro-label">{{ fact.label }}</dt>
            <dd class="mt-1.5 text-[0.95rem] leading-snug font-semibold text-ink">
              {{ fact.value }}
            </dd>
          </div>
        }
      </dl>
    </div>
  </div>
</section>
