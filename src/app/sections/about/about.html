<!-- About Section -->
<section id="ueber-mich" class="bg-white">
  <div class="site-shell grid items-center gap-12 lg:grid-cols-[0.8fr_1.2fr] lg:gap-20">
    <!-- Portrait faces right, so this card must stay in the left column:
         he looks into the text instead of off the page. -->
    <div data-reveal class="order-2 mx-auto w-full max-w-sm lg:order-1 lg:max-w-none">
      <figure
        class="relative isolate aspect-4/5 overflow-hidden rounded-2xl bg-canvas shadow-[0_1.5rem_4rem_-2rem_rgb(12_23_51/30%)]"
      >
        <div
          class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_48%_30%,rgb(30_82_204/18%),transparent_48%),linear-gradient(160deg,#f2f5fd_0%,#dde5f8_75%)]"
          aria-hidden="true"
        ></div>
        <div
          class="pointer-events-none absolute top-[14%] left-[-18%] size-48 rounded-full border border-brand/15"
          aria-hidden="true"
        ></div>
        <div
          class="pointer-events-none absolute top-[20%] left-[-8%] size-32 rounded-full border border-brand/10"
          aria-hidden="true"
        ></div>
        <img
          ngSrc="images/profile.webp"
          fill
          class="z-1 object-contain object-bottom"
          alt="Mehmet Deliaci"
        />
      </figure>
    </div>

    <div data-reveal class="order-1 lg:order-2">
      <span class="eyebrow">{{ content().about.label }}</span>
      <h2 class="display-title mt-3 max-w-[16em]">{{ content().about.heading }}</h2>
      <p class="mt-5 max-w-136 font-serif text-xl leading-relaxed italic text-brand">
        {{ content().about.lead }}
      </p>

      <div class="mt-6 max-w-2xl space-y-4 text-base leading-[1.72] text-copy">
        <p>{{ content().about.p1 }}</p>
        <p>{{ content().about.p2 }}</p>
        <p>{{ content().about.p3 }}</p>
      </div>

      <dl class="mt-9 grid grid-cols-2 gap-x-8 gap-y-6 border-t border-ink/10 pt-7">
        @for (fact of content().about.facts; track fact.label) {
          <div>
            <dt class="micro-label">{{ fact.label }}</dt>
            <dd class="mt-1.5 text-sm font-bold text-ink">{{ fact.value }}</dd>
          </div>
        }
      </dl>
    </div>
  </div>
</section>
