<section id="ablauf" class="bg-canvas">
  <div class="site-shell">
    <app-section-heading
      data-reveal
      [eyebrow]="content().process.label"
      [title]="content().process.heading"
    />

    <div data-reveal class="process-timeline relative mt-14">
      <!-- Static guide line; the beam below draws over it on scroll. Both
           fade out at the ends via the mask. -->
      <div
      class="pointer-events-none absolute top-0 left-5 h-full w-0.5 -translate-x-1/2 bg-brand/15 mask-[linear-gradient(to_bottom,transparent,black_8%,black_92%,transparent)]"
        aria-hidden="true"
      ></div>
      <div
      class="process-beam pointer-events-none absolute top-0 left-5 h-full w-0.5 -translate-x-1/2 bg-linear-to-b from-brand via-[#4775ec] to-[#9bb5ff] mask-[linear-gradient(to_bottom,transparent,black_8%,black_92%,transparent)]"
        aria-hidden="true"
      ></div>

      <ol>
        @for (step of content().process.items; track step.title) {
          <li class="relative flex pt-12 first:pt-4 last:pb-4 md:pt-20">
            <!-- Marker dot + big number, sticky while the entry passes -->
            <div class="sticky top-28 z-10 flex items-center self-start md:w-60 md:shrink-0">
              <span
                class="absolute left-0 flex size-10 items-center justify-center rounded-full border border-brand/20 bg-canvas"
                aria-hidden="true"
              >
                <span class="size-3 rounded-full bg-brand"></span>
              </span>
              <span
                class="hidden pl-16 font-serif text-6xl italic text-brand/25 md:block"
                aria-hidden="true"
                >0{{ $index + 1 }}</span
              >
            </div>
            <div class="w-full pl-16 md:pl-0">
              <h3 class="font-serif text-xl font-semibold text-ink md:text-2xl">
                <span class="mr-1.5 italic text-brand/40 md:hidden" aria-hidden="true"
                  >0{{ $index + 1 }}</span
                >{{ step.title }}
              </h3>
              <p class="mt-3 max-w-xl text-sm leading-relaxed text-copy md:text-md">
                {{ step.description }}
              </p>
            </div>
          </li>
        }
      </ol>
    </div>

    <!-- Mid-page CTA: catches visitors convinced by the process, before the long scroll to the form -->
    <div
      data-reveal
      class="mt-16 flex flex-col items-center gap-5 rounded-[20px] border border-brand/10 bg-white px-6 py-10 text-center shadow-[0_24px_52px_-32px_rgb(30_82_204/22%)] sm:py-12"
    >
      <p class="font-serif text-2xl font-medium text-ink sm:text-3xl">
        {{ content().process.ctaLead }}
      </p>
      <a href="#kontakt" class="primary-button">{{ content().process.cta }} <span>→</span></a>
      <p class="font-mono text-xs text-copy">{{ content().process.ctaNote }}</p>
    </div>
  </div>
</section>
