<section id="ablauf" class="bg-white">
  <div class="site-shell">
    <app-section-heading
      data-reveal
      data-scroll-fx
      [eyebrow]="content().process.label"
      [title]="content().process.heading"
    />

    <!-- Phones: vertical timeline. Desktop: four columns on one line.
         The guide line draws itself while the steps scroll into view. -->
    <div class="process-track relative mt-12 lg:mt-16">
      <span class="process-line" aria-hidden="true"
        ><span class="process-beam" data-scroll-fx></span
      ></span>
      <ol class="process-steps">
        @for (step of content().process.items; track step.title; let i = $index) {
          <li class="process-step relative">
            <span
              class="process-dot relative z-10 flex size-11 items-center justify-center rounded-full border border-brand/20 bg-white font-mono text-xs font-medium text-brand"
              aria-hidden="true"
              >0{{ i + 1 }}</span
            >
            <div>
              <h3 class="font-serif text-[1.375rem] leading-tight font-medium text-ink lg:mt-7">
                {{ step.title }}
              </h3>
              <p class="mt-2.5 max-w-sm text-md text-copy">{{ step.description }}</p>
            </div>
          </li>
        }
      </ol>
    </div>

    <!-- Mid-page CTA: catches visitors convinced by the process, before the long scroll to the form -->
    <div
      class="mt-16 flex flex-col items-start gap-5 rounded-[1.75rem] bg-ink px-7 py-9 sm:px-10 lg:mt-20 lg:flex-row lg:items-center lg:justify-between lg:py-10"
    >
      <div>
        <p
          class="font-serif text-[clamp(1.5rem,2.6vw,2.125rem)] leading-tight font-medium text-white"
        >
          {{ content().process.ctaLead }}
        </p>
        <p class="mt-2 font-mono text-xs text-mist">{{ content().process.ctaNote }}</p>
      </div>
      <a href="#kontakt" class="primary-button max-sm:w-full">
        {{ content().process.cta }}
        <app-icon name="arrow-right" class="nudge size-4" />
      </a>
    </div>
  </div>
</section>
