<!-- Services: what every website gets, as six tiles -->
<section id="leistungen" class="bg-canvas">
  <div class="site-shell">
    <div
      data-reveal
      data-scroll-fx
      class="grid gap-6 lg:grid-cols-[1.15fr_1fr] lg:items-end lg:gap-16"
    >
      <app-section-heading
        [eyebrow]="content().services.label"
        [title]="content().services.heading"
      />
      <p class="max-w-xl text-lead text-copy">{{ content().services.sub }}</p>
    </div>

    <ul class="mt-12 grid gap-3 sm:grid-cols-2 lg:mt-16 lg:grid-cols-3 lg:gap-4">
      @for (service of content().services.items; track service.title; let i = $index) {
        <li class="service-tile group">
          <div class="flex items-center justify-between">
            <span
              class="flex size-12 items-center justify-center rounded-2xl bg-brand/8 text-brand transition-colors duration-300 group-hover:bg-brand group-hover:text-white"
            >
              <app-icon [name]="icons[i]" class="size-5.5" />
            </span>
            <span class="font-mono text-xs tracking-[0.16em] text-copy" aria-hidden="true">
              0{{ i + 1 }}
            </span>
          </div>
          <h3
            class="mt-7 font-serif text-[1.375rem] leading-tight font-medium tracking-[-0.01em] text-ink"
          >
            {{ service.title }}
          </h3>
          <p class="mt-3 text-md text-copy">{{ service.text }}</p>
        </li>
      }
    </ul>
  </div>
</section>
