<!-- Aether-style hero, adapted to the site's Angular architecture and brand system. -->
<section
  id="top"
  class="relative isolate flex min-h-[max(46rem,100svh)] items-center overflow-hidden bg-[#050914] text-white"
  (pointermove)="onPointerMove($event)"
  (pointerleave)="clearPointer()"
>
  <canvas
    #networkCanvas
    class="pointer-events-none absolute inset-0 size-full"
    aria-hidden="true"
  ></canvas>

  <!-- Subtle brand-blue atmosphere behind the particle network. -->
  <div
    class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_50%_42%,rgb(30_82_204/20%),transparent_38%),radial-gradient(circle_at_12%_15%,rgb(83_132_255/10%),transparent_26%),radial-gradient(circle_at_88%_80%,rgb(30_82_204/12%),transparent_28%)]"
    aria-hidden="true"
  ></div>
  <div
    class="pointer-events-none absolute inset-x-0 bottom-0 h-48 bg-linear-to-b from-transparent to-[#050914]"
    aria-hidden="true"
  ></div>

  <div
    class="relative z-10 mx-auto flex w-full max-w-330 flex-col items-center px-5 pt-30 pb-24 text-center sm:px-9 sm:pt-34 lg:px-13"
  >
    <span
      class="animate-fade-up inline-flex items-center gap-2.5 rounded-full border border-[#7193ff]/25 bg-[#1e52cc]/12 px-4 py-2 font-mono text-xs font-medium text-[#c8d5ff] backdrop-blur-md"
    >
      <span class="relative flex size-2">
        <span class="absolute inline-flex size-full animate-ping rounded-full bg-[#79a0ff] opacity-50"></span>
        <span class="relative inline-flex size-2 rounded-full bg-[#79a0ff]"></span>
      </span>
      {{ content().hero.available }}
    </span>

    <h1
      class="animate-fade-up mt-7 max-w-285 font-serif text-[clamp(2.65rem,7.25vw,6.6rem)] leading-[0.98] font-medium tracking-[-0.045em] text-white [animation-delay:100ms]"
    >
      {{ content().hero.main }}
      <span
        class="block bg-linear-to-b from-[#9bb5ff] to-[#4775ec] bg-clip-text pt-2 text-transparent italic"
      >
        {{ content().hero.accent }}
      </span>
    </h1>

    <p
      class="animate-fade-up mt-7 max-w-190 text-[clamp(1rem,1.45vw,1.2rem)] leading-relaxed text-[#aab5d1] [animation-delay:200ms]"
    >
      {{ content().hero.sub }}
    </p>

    <div
      class="animate-fade-up mt-10 flex w-full flex-col justify-center gap-3.5 [animation-delay:300ms] sm:w-auto sm:flex-row"
    >
      <a
        href="#kontakt"
        class="group inline-flex items-center justify-center gap-2.5 rounded-lg bg-white px-7 py-4 text-md font-bold text-[#071027] shadow-[0_1rem_3rem_-1rem_rgb(66_112_234/75%)] transition hover:-translate-y-0.5 hover:bg-[#e8edff]"
      >
        {{ content().hero.primary }}
        <svg
          viewBox="0 0 24 24"
          fill="none"
          class="size-5 transition-transform group-hover:translate-x-1"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </a>
      <a
        href="#referenzen"
        class="inline-flex items-center justify-center rounded-lg border border-white/20 bg-white/6 px-7 py-4 text-md font-semibold text-white backdrop-blur-md transition hover:-translate-y-0.5 hover:border-[#86a4ff]/55 hover:bg-white/10"
      >
        {{ content().hero.secondary }}
      </a>
    </div>

    <ul
      class="animate-fade-up mt-12 flex max-w-240 flex-col items-center gap-x-8 gap-y-3 border-t border-white/10 pt-7 [animation-delay:400ms] sm:flex-row sm:flex-wrap sm:justify-center"
    >
      @for (point of content().hero.trust; track point) {
        <li class="flex items-center gap-2 text-sm font-medium text-[#aab5d1]">
          <svg
            viewBox="0 0 20 20"
            class="size-4 shrink-0 text-[#7fa2ff]"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m4 10 3.5 3.5L16 5.5" />
          </svg>
          {{ point }}
        </li>
      }
    </ul>
  </div>

  <div
    class="pointer-events-none absolute bottom-7 left-1/2 z-10 hidden -translate-x-1/2 flex-col items-center gap-2.5 lg:flex"
    aria-hidden="true"
  >
    <span class="font-mono text-[10px] tracking-[0.2em] text-white/40 uppercase">scroll</span>
    <div class="scroll-line h-8 w-px bg-[#7193ff]/70"></div>
  </div>
</section>
