name: Build and deploy production website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy over FTPS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular production bundle
        run: npm run build -- --configuration production

      - name: Verify deployable output
        run: test -f dist/business-portfolio/browser/index.html

      - name: Synchronize production website over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || '21' }}
          local-dir: ./dist/business-portfolio/browser/
          # This is the domain directory, not the FTPS account root.
          server-dir: ./mehmet-deliaci.net/
          # Preserve separately deployed apps that live below the same directory.
          dangerous-clean-slate: false
          log-level: standard
